name: Daily Instagram Post

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot: morning | midday | afternoon | evening. Blank = time-based."
        required: false
        default: ""
      dry_run:
        description: "If 'yes', render + queue but DO NOT post."
        required: false
        default: "no"
  schedule:
    # GitHub cron is UTC, no DST, and fires APPROXIMATELY (often a few min late —
    # which helps it feel human, not robotic). We cover each NY target hour in
    # both EDT(-4) and EST(-5); the gate below maps NY-local hour -> a slot so
    # exactly one action runs per target window per day.
    #
    # Daily plan (America/New_York), staggered around Joseph's 4 videos
    # (videos at 9:30a, 1:30p, 5:30p, 9:30p — untouched):
    #   ~8a  morning   : post #1 (mixed format) + morning story sequence
    #   ~12p midday    : post #2 (mixed format)
    #   ~4p  afternoon : afternoon story sequence
    #   ~7p  evening   : post #3 (carousel) + evening story sequence
    - cron: "0 12 * * *"   # 8a EDT
    - cron: "0 13 * * *"   # 8a EST
    - cron: "0 16 * * *"   # 12p EDT
    - cron: "0 17 * * *"   # 12p EST
    - cron: "0 20 * * *"   # 4p EDT
    - cron: "0 21 * * *"   # 4p EST
    - cron: "0 23 * * *"   # 7p EDT
    - cron: "0 0 * * *"    # 7p EST

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pillow

      - name: Decide slot (DST-proof, maps NY hour -> action)
        id: slot
        run: |
          FORCED="${{ github.event.inputs.slot }}"
          if [ -n "$FORCED" ]; then
            echo "kind=$FORCED" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Forced slot: $FORCED"; exit 0
          fi
          HOUR=$(TZ="America/New_York" date +%H)
          echo "New York hour: $HOUR"
          case "$HOUR" in
            08) echo "kind=morning"   >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT";;
            12) echo "kind=midday"    >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT";;
            16) echo "kind=afternoon" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT";;
            19) echo "kind=evening"   >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT";;
            *)  echo "Outside post windows; skipping."; echo "run=no" >> "$GITHUB_OUTPUT";;
          esac

      # Feed slot: morning + midday = single (mixed format); evening = carousel.
      - name: Pick feed slot for daily_run
        id: feed
        if: steps.slot.outputs.run == 'yes'
        run: |
          K="${{ steps.slot.outputs.kind }}"
          if [ "$K" = "morning" ] || [ "$K" = "midday" ]; then echo "slot=am" >> "$GITHUB_OUTPUT"; echo "do_feed=yes" >> "$GITHUB_OUTPUT";
          elif [ "$K" = "evening" ]; then echo "slot=pm" >> "$GITHUB_OUTPUT"; echo "do_feed=yes" >> "$GITHUB_OUTPUT";
          else echo "do_feed=no" >> "$GITHUB_OUTPUT"; fi
          # stories run in morning, afternoon, evening (2-3 moments/day)
          if [ "$K" = "midday" ]; then echo "do_story=no" >> "$GITHUB_OUTPUT"; else echo "do_story=yes" >> "$GITHUB_OUTPUT"; fi

      # ---------------- FEED POST ----------------
      - name: Render + queue feed
        if: steps.feed.outputs.do_feed == 'yes'
        env:
          SLOT: ${{ steps.feed.outputs.slot }}
        run: python daily_run.py --render-only

      - name: Commit feed image
        if: steps.feed.outputs.do_feed == 'yes'
        run: |
          git config user.name "ig-poster-bot"
          git config user.email "actions@github.com"
          git add queue/ state.json
          git commit -m "queue $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push

      - name: Publish feed post
        if: steps.feed.outputs.do_feed == 'yes' && github.event.inputs.dry_run != 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python daily_run.py --publish-only

      - name: Persist feed state
        if: steps.feed.outputs.do_feed == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          git add queue/ state.json .pending.json 2>/dev/null || true
          git commit -m "posted feed $(date -u +%FT%TZ)" || echo "no change"
          git push || true

      # ---------------- STORIES (morning / afternoon / evening) ----------------
      - name: Natural stagger before stories (feel human, not a bot)
        if: steps.feed.outputs.do_story == 'yes' && steps.feed.outputs.do_feed == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          # wait a randomized 3-7 minutes so the story doesn't fire the same
          # second as the feed post — reads like a person, not automation.
          DELAY=$(( (RANDOM % 240) + 180 ))
          echo "Sleeping ${DELAY}s before stories..."
          sleep "$DELAY"

      - name: Render stories
        if: steps.feed.outputs.do_story == 'yes' && github.event.inputs.dry_run != 'yes'
        run: python post_stories.py --render-only

      - name: Commit story images
        if: steps.feed.outputs.do_story == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          git add queue/ state.json
          git commit -m "render stories $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push

      - name: Publish stories
        if: steps.feed.outputs.do_story == 'yes' && github.event.inputs.dry_run != 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_stories.py --publish-only

      - name: Persist story state
        if: steps.feed.outputs.do_story == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          git add state.json .stories_pending.json 2>/dev/null || true
          git commit -m "stories posted $(date -u +%FT%TZ)" || echo "no change"
          git push || true

      - name: Dry-run note
        if: steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run == 'yes'
        run: echo "DRY RUN — slot=${{ steps.slot.outputs.kind }}, feed=${{ steps.feed.outputs.do_feed }}, story=${{ steps.feed.outputs.do_story }} (nothing posted)"
