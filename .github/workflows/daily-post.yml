name: Daily Instagram Post

on:
  # A push to main triggers a real run on GitHub's runner (push events are
  # processed reliably, unlike best-effort cron). The catch-up plan + once-per-
  # day state guard mean this only posts slots that are due and not yet done —
  # so it never double-posts. paths-ignore excludes the files the bot itself
  # commits (queue images, state) so the bot's own pushes can't re-trigger it.
  push:
    branches: [main]
    paths-ignore:
      - "queue/**"
      - "state.json"
      - ".slotguard/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot: morning | midday | afternoon | evening. Blank = catch-up plan (posts current + any earlier feed slot missed today)."
        required: false
        default: ""
      dry_run:
        description: "If 'yes', render + commit but DO NOT post."
        required: false
        default: "no"
  schedule:
    # GitHub cron is UTC, no DST, and BEST-EFFORT (often late, sometimes dropped
    # entirely). We fire each NY target window at off-peak minutes AND twice (a
    # primary + a backup), covering both EDT(-4) and EST(-5). But the real
    # safety net is plan_slots.py: every run posts the current slot PLUS any
    # earlier *feed* slot that was missed today, so a dropped cron is recovered
    # by the next one instead of being lost. Once-per-day is tracked in
    # state.json (state["daily"]), not in committed guard files.
    #
    # Daily plan (America/New_York), around Joseph's 4 videos (9:30a/1:30p/5:30p/9:30p):
    #   ~8a  morning   : feed post (mixed format) + morning story
    #   ~12p midday    : feed post (mixed format)
    #   ~4p  afternoon : (nothing; cron doubles as a midday-feed catch-up sweep)
    #   ~7p  evening   : carousel feed post (no story)
    # One story a day (morning); midday/evening feed-only, afternoon quiet.
    # A cross-channel de-dup guard (content_dedup.py) ensures a story and a feed
    # post never show the same line.
    # morning ~8a ET
    - cron: "37 12 * * *"  # 8:37a EDT
    - cron: "2 13 * * *"   # 8:02a EST / backup
    # midday ~12p ET
    - cron: "37 16 * * *"  # 12:37p EDT
    - cron: "2 17 * * *"   # 12:02p EST / backup
    # afternoon ~4p ET
    - cron: "37 20 * * *"  # 4:37p EDT
    - cron: "2 21 * * *"   # 4:02p EST / backup
    # evening ~7p ET
    - cron: "37 23 * * *"  # 7:37p EDT
    - cron: "2 0 * * *"    # 7:02p EST / backup
    # extra catch-up sweeps later in the day so a fully-dropped window still
    # recovers (these only act on slots not yet done — see plan_slots.py)
    - cron: "17 18 * * *"  # ~1-2p ET sweep
    - cron: "17 22 * * *"  # ~5-6p ET sweep
    - cron: "17 1 * * *"   # ~8-9p ET sweep

permissions:
  contents: write

# Serialize runs so two crons in the same window can't double-post: the second
# waits for the first to finish, then re-syncs state and sees the slot done.
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pillow tzdata

      - name: Post due slots (catch-up plan; once-per-day via state.json)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FORCE_SLOT: ${{ github.event.inputs.slot }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-main}"
          git config user.name "ig-poster-bot"
          git config user.email "actions@github.com"

          # push current commits to the ref we're running on (main on schedule;
          # the chosen branch on workflow_dispatch). retry w/ rebase on conflict.
          gp() {
            for i in 1 2 3 4; do
              if git push origin "HEAD:$REF"; then return 0; fi
              git pull --rebase origin "$REF" || true
              sleep $((i * 2))
            done
            echo "WARN: push failed after retries" >&2
          }

          # sync to the freshest state before planning so a just-finished run's
          # "slot done" marks (and queue images) are visible — prevents dupes.
          git pull --rebase origin "$REF" || git pull origin "$REF" || true

          python plan_slots.py --plan > /tmp/plan.txt
          echo "Plan ($(TZ=America/New_York date)):"; cat /tmp/plan.txt
          if [ ! -s /tmp/plan.txt ]; then echo "No slots due — nothing to do."; exit 0; fi

          while IFS='|' read -r KIND FEED STORY; do
            [ -z "$KIND" ] && continue
            echo "===== slot: $KIND (feed=$FEED story=$STORY dry=${DRY:-no}) ====="
            FEED_OK=0

            # ---- FEED ----
            if [ "$FEED" != "-" ]; then
              SLOT="$FEED" python daily_run.py --render-only
              git add queue/ state.json
              git commit -q -m "render feed $KIND $(date -u +%FT%TZ)" || true
              gp   # publish needs the image live at raw.githubusercontent first
              if [ "${DRY:-no}" != "yes" ]; then
                if SLOT="$FEED" python daily_run.py --publish-only; then FEED_OK=1; fi
                git add queue/ state.json
                git commit -q -m "posted feed $KIND $(date -u +%FT%TZ)" || true
                gp
              fi
            fi

            # ---- STORY (live windows only) ----
            if [ "$STORY" = "1" ] && [ "${DRY:-no}" != "yes" ]; then
              # short human stagger so the story doesn't fire the same second
              sleep $(( (RANDOM % 180) + 120 ))
              SLOT_KIND="$KIND" python post_stories.py --render-only
              git add queue/ state.json
              git commit -q -m "render stories $KIND $(date -u +%FT%TZ)" || true
              gp
              SLOT_KIND="$KIND" python post_stories.py --publish-only || echo "stories failed (non-fatal)"
              git add state.json
              git commit -q -m "stories posted $KIND $(date -u +%FT%TZ)" || true
              gp
            fi

            # ---- MARK DONE ---- only after a real post, so a failure retries
            # next run. Feed slots: mark when the feed published. Story-only
            # slots (afternoon): mark after the story attempt.
            if [ "${DRY:-no}" != "yes" ]; then
              if [ "$FEED" != "-" ]; then
                [ "$FEED_OK" = "1" ] && python plan_slots.py --mark "$KIND"
              else
                python plan_slots.py --mark "$KIND"
              fi
              git add state.json
              git commit -q -m "slot $KIND done $(date -u +%FT%TZ)" || true
              gp
            fi
          done < /tmp/plan.txt

          echo "Done."
