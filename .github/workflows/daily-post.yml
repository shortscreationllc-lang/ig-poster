name: Daily Instagram Post

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Force slot: am (single, dark) or pm (carousel, light). Blank = time-based."
        required: false
        default: ""
      dry_run:
        description: "If 'yes', render + queue but DO NOT post."
        required: false
        default: "no"
  schedule:
    # UTC, no DST. Cover 8AM/8PM ET in both EDT(-4) and EST(-5); the gate
    # below ensures exactly one am + one pm run actually post per day.
    - cron: "0 12 * * *"   # 8AM EDT
    - cron: "0 13 * * *"   # 8AM EST
    - cron: "0 0 * * *"    # 8PM EDT
    - cron: "0 1 * * *"    # 8PM EST

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pillow

      - name: Decide slot (DST-proof)
        id: slot
        run: |
          FORCED="${{ github.event.inputs.slot }}"
          if [ -n "$FORCED" ]; then
            echo "slot=$FORCED" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Forced slot: $FORCED"; exit 0
          fi
          HOUR=$(TZ="America/New_York" date +%H)
          echo "New York hour: $HOUR"
          if [ "$HOUR" = "08" ]; then echo "slot=am" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT";
          elif [ "$HOUR" = "20" ]; then echo "slot=pm" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT";
          else echo "Not 8AM/8PM NY; skipping."; echo "run=no" >> "$GITHUB_OUTPUT"; fi

      - name: Render + queue (buffer)
        if: steps.slot.outputs.run == 'yes'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python daily_run.py --render-only

      - name: Commit queue + images (raw URLs must exist before posting)
        if: steps.slot.outputs.run == 'yes'
        run: |
          git config user.name "ig-poster-bot"
          git config user.email "actions@github.com"
          git add queue/ state.json
          git commit -m "queue refill $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push

      - name: Publish to Instagram
        if: steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run != 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python daily_run.py --publish-only

      - name: Dry-run reachability check (no post)
        if: steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run == 'yes'
        run: |
          ID=$(python -c "import json;print(json.load(open('.pending.json'))['id'])")
          REL=$(python -c "import json;m=json.load(open('queue/manifest.json'));print([i for i in m['items'] if i['id']=='$ID'][0]['images'][0])")
          IMG="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${REL// /%20}"
          echo "Would post id=$ID first image: $IMG"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$IMG")
          echo "HTTP $code"; test "$code" = "200" && echo "DRY RUN OK" || (echo "unreachable"; exit 1)

      - name: Persist posted state + refilled queue
        if: steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          git add queue/ state.json .pending.json 2>/dev/null || true
          git commit -m "posted + refill $(date -u +%FT%TZ)" || echo "no change"
          git push || true

      # --- MORNING STORIES (AM slot only): hook story + reshare of the feed card ---
      - name: Render stories (AM only)
        if: steps.slot.outputs.slot == 'am' && steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run != 'yes'
        run: python post_stories.py --render-only

      - name: Commit story images (raw URLs must exist before posting)
        if: steps.slot.outputs.slot == 'am' && steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          git add queue/ state.json
          git commit -m "render stories $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push

      - name: Publish stories to Instagram
        if: steps.slot.outputs.slot == 'am' && steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run != 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_stories.py --publish-only

      - name: Persist story state
        if: steps.slot.outputs.slot == 'am' && steps.slot.outputs.run == 'yes' && github.event.inputs.dry_run != 'yes'
        run: |
          git add state.json .stories_pending.json 2>/dev/null || true
          git commit -m "stories posted $(date -u +%FT%TZ)" || echo "no change"
          git push || true
