name: Auto-post real videos (Instagram)

# autopost.py: posts Joseph's approved videos from Dropbox. Starts in PRACTICE
# mode (autopost_config.json "mode"): reports what it would post, posts nothing.
# Cron fires twice so the ~4:40 PM Miami slot works in both EDT and EST; the
# script itself decides whether today is a posting day (every other day).

on:
  schedule:
    - cron: "41 20 * * *"
    - cron: "41 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, ignoring the schedule (yes/no)"
        default: "no"
      mode:
        description: "Override mode for this run: practice | live (blank = config)"
        default: ""

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffprobe
        run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run auto-poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          args=""
          [ "$IN_FORCE" = "yes" ] && args="$args --force"
          case "$IN_MODE" in practice|live) args="$args --mode $IN_MODE";; esac
          python autopost.py $args

      - name: Save state + log
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add autopost_state.json autopost_log.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "autopost $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
